name: Dependency audit

# Two jobs, two different artifacts, on purpose.
#
# `build-tree-audit` measures THIS REPO'S lockfile. `consumer-audit` measures the tree a
# user resolves from the PUBLISHED package. They are kept separate rather than
# folded together so the two numbers stay legible as the two different
# measurements they are — a reviewer seeing "N here, M there" should be able to
# tell which tree each one describes.
#
# Why both exist, and why the second one is the load-bearing half:
#
# On 2026-08-10 the published `opena2a-cli@0.10.13` production tree was found
# to carry a high advisory (GHSA-xcpc-8h2w-3j85, adm-zip) through
# `hackmyagent -> onnxruntime-node -> adm-zip`. Every repo-level audit in the
# org was green at the time, including `hackmyagent`'s own — because an
# ordinary `npm audit` runs against a repo lockfile, which carries
# devDependencies and honours local `overrides`, and `overrides` are not
# published. The artifact we audit is not the artifact we ship.
#
# `hackmyagent` responded by adding a consumer-resolution job. `ai-trust` never
# received that fan-out and had no audit workflow of any kind, while being one
# of the two packages that shipped the advisory to users. This file closes
# that.
#
# The rule it encodes: a gate is defined by the artifact it measures. A gate
# that measures the repo when the risk lives in the published tree is
# decorative regardless of its colour.
#
# Threshold is `high` on purpose. Gating on `moderate` would let any newly
# published moderate advisory — against a dependency no PR touched, on code
# that may not even load — block unrelated work, and an unwaivable false
# critical costs more than a miss. Moderate and low findings are still printed.
#
# Honest cost of both jobs: `npm audit` queries a live advisory database, so a
# PR can go red for something its own diff did not introduce. That is intended.
# A new high advisory against a shipped CLI's dependency tree should stop the
# line, and the fix is to raise the floor rather than to make this advisory.

on:
  pull_request:
  push:
    branches: [main]
  # The published tree can go bad with nothing in this repo changing — an
  # advisory published against an untouched transitive dependency does it. That
  # question is asked on a timer, because no diff can trigger it.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This repo's committed lockfile — the tree `npm ci` installs on CI runners
  # and maintainer machines.
  #
  # Named for the artifact it measures rather than `audit`, which claimed the
  # whole domain and made this job's red indistinguishable from the consumer
  # job's at a glance.
  #
  # It matters on its own terms, separately from what users resolve:
  # `release.yml`'s publish job runs `npm ci` — executing every dependency's
  # install script — in the same job that holds `id-token: write` and runs
  # `npm publish --provenance`. This is the tree an attacker would use to alter
  # what we publish, and nothing else here measures it.
  #
  # It runs on the weekly schedule too. It previously did not, because it was
  # permanently red and a permanently red job carries no differential signal —
  # but that justification expired when the job went green, and a gate that
  # only ever runs on diffs cannot see an advisory published against a
  # dependency nobody touched.
  build-tree-audit:
    name: Build tree audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # No `cache: npm` on purpose — nothing is installed below, so there
          # is no download to cache.

      # `--package-lock-only` audits the committed lockfile directly. Two
      # reasons it is preferred over `npm ci` followed by an audit:
      #
      # 1. It installs nothing, so no dependency's install script executes.
      #    This job runs on `pull_request`, which includes pull requests from
      #    forks, and a job that runs `npm ci` on a fork's branch executes
      #    whatever that branch put in a `postinstall` — least acceptable in
      #    the CI of a tool whose subject is supply-chain risk.
      # 2. It audits the versions the repo actually pins rather than a tree
      #    resolved fresh on the runner, which is the thing being gated.

      # Informational, never fails: the full picture including moderate and
      # low, so a reviewer can see what is accumulating below the threshold.
      - name: Full advisory report (informational)
        run: npm audit --package-lock-only || true

      # Also informational: the production-only subset, which is the part of
      # this lockfile that has any chance of reaching a user. The difference
      # between this and the report above is the devDependency-only noise.
      - name: Production-only advisory report (informational)
        run: npm audit --package-lock-only --omit=dev || true

      # The gate.
      #
      # Asserts "high/critical advisory ids, minus the ids already formally
      # accepted for the SHIPPED artifact, is empty" rather than "the count is
      # zero". The severity threshold is unchanged and there is no suppression
      # primitive — a new high advisory fails on the run it appears. What the
      # set difference buys is the ability to tell "new and unexamined" from
      # "known and adjudicated", which a count cannot, and which is why this
      # job previously sat red long enough to stop being read.
      #
      # Acceptances live in `scripts/lib/accepted-advisories.mjs`, the same
      # list the consumer job enforces. The coupling is one-way by
      # construction: an id can be waived here only because it is already
      # accepted for users. See that file for why `derive()` is deliberately
      # not run from this job.
      - name: Fail on unaccepted high or critical advisories
        run: node scripts/audit-build-tree.mjs

  # The consumer audit, in two halves, because there are two artifacts and the
  # first version of this wiring measured only one of them — the wrong one for
  # a pull request.
  #
  # It passed no `--target`, so the script fell back to the published
  # `ai-trust@<latest>` and resolved the ALREADY-PUBLISHED package on every PR.
  # A PR that added a vulnerable dependency therefore went GREEN, because the
  # gate was reading npm rather than what the PR would publish. That is this
  # gate's own stated rule — a gate is defined by the artifact it measures —
  # broken by the gate itself.
  #
  #   consumer-audit-candidate  packs this branch and audits the tarball.
  #                             Runs on pull_request and push, and the same
  #                             check gates the release path in `release.yml`
  #                             BEFORE `npm publish`. This is the one that can
  #                             fail on a diff.
  #   consumer-audit-published  audits the published `ai-trust@<latest>`. Runs
  #                             on the weekly schedule. A different question —
  #                             has the tree users already installed drifted? —
  #                             that no PR can turn green and no diff triggers.
  #
  # Both print `[CANDIDATE]` / `[PUBLISHED]` in every banner and in the closing
  # line, because the two numbers are not comparable and a reader has to be able
  # to tell which tree a red build describes.
  consumer-audit-candidate:
    name: Consumer resolution audit (candidate artifact)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # No `cache: npm`, and no `npm ci`: the script uses only node
          # builtins and the npm CLI, and measures a packed tarball's own
          # resolution rather than this tree's.

      # `--ignore-scripts` so a fork's `prepack`/`prepare` cannot execute on the
      # runner, and NO build step, deliberately. What decides whether a user
      # inherits an advisory is the manifest's dependency closure, which
      # `npm pack` carries whether or not `dist/` was compiled — so building
      # would buy no measurement and would cost arbitrary code execution from a
      # pull request's branch.
      - name: Pack the artifact this branch would publish
        id: pack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/candidate" >/dev/null
          tarball="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -name '*.tgz' | head -n1)"
          test -n "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Audit the tree a consumer would resolve from this branch
        run: npm run audit:consumer -- --target "${{ steps.pack.outputs.tarball }}"

  consumer-audit-published:
    name: Consumer resolution audit (published artifact)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Nothing from this checkout is installed: the target is a published
      # registry spec, resolved with `--ignore-scripts`. A failure here is not
      # fixable by merging anything; it clears when a fix is RELEASED.
      - name: Audit the tree a consumer resolves from npm today
        run: npm run audit:consumer
