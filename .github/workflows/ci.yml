name: CI

# `package-lock.json` is in both filters deliberately. It was missing, and the
# omission was found by a pull request that changed ONLY the lockfile — a
# 45-version dependency refresh — and therefore ran no tests at all. The
# lockfile is what decides which code actually executes; a change to it
# deserves a test run at least as much as a `package.json` edit does, which
# was already covered. `parity.yml` already listed it, so the two workflows
# also disagreed about whether the lockfile was worth reacting to.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # vitest 4 requires Node 20.19+/22.12+ (uses node:util styleText) and
        # dropped Node 18, which is EOL (2025-04-30). Test on supported LTS only.
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
